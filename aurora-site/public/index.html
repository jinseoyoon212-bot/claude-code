<main>

<form id="form"><input id="input" placeholder="오로라에게 물어보세요" autocomplete="off" autofocus><button class="send primary" aria-label="보내기"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5.5 11.5 12 5l6.5 6.5"/></svg></button></form>
<dialog id="settings"><form method="dialog">

  <label>API 키<input data-k="apiKey" type="password" autocomplete="off"></label>
  <p class="hint" id="keyHelp"></p>
  <label>모델<input data-k="model"></label>
  <label>빠른 응답용 모델 (비우면 자동)<input data-k="fastModel" placeholder="gemini-2.5-flash-lite"></label>
  <p class="hint">✨ 기본값 "Aurora 기본 AI"는 사이트가 대신 연결해 줘서 키가 필요 없어요. (다른 제공자를 쓰려면 키를 넣으세요)<br>🔒 입력한 API 키는 이 브라우저에만 저장되고, 선택한 AI 제공자에게만 전송돼요.<br>🎤 얼굴을 눌러 말하는 기능은 Google Gemini 키가 있을 때 쓸 수 있어요.</p>
  <menu><button value="cancel">닫기</button><button id="save" class="primary" value="ok">저장</button></menu>
</form></dialog>

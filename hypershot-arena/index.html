<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>HYPER ARENA</title>
<link rel="stylesheet" href="/src/style.css" />
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <div id="crosshair"><i class="t"></i><i class="b"></i><i class="l"></i><i class="r"></i><i class="d"></i></div>
  <div id="scope" class="hidden"></div>
  <div id="hitmarker"></div>
  <div id="dmg"></div>
  <div id="damageDirs"></div>
  <div id="topbar">
    <div class="score you"><small>YOU</small><b id="myScore">0</b></div>
    <div id="timer">5:00</div>
    <div class="score foe"><small>BEST BOT</small><b id="botScore">0</b></div>
  </div>
  <div id="killfeed"></div>
  <canvas id="minimap" width="170" height="170"></canvas>
  <div id="banner"></div>
  <div id="bottomLeft">
    <div id="hpNum">100</div>
    <div id="hpBar"><div id="hpFill"></div></div>
  </div>
  <div id="bottomRight">
    <div id="wname">RIFLE</div>
    <div id="ammo"><b id="mag">30</b><span> / <span id="reserve">120</span></span></div>
    <div id="wslots"></div>
  </div>
  <div id="reloadBar"><div></div></div>
</div>

<div id="scoreboard" class="hidden"></div>
<div id="vignette"></div>

<div id="menu">
  <div class="menuInner">
    <div class="logo">HYPER<span>ARENA</span></div>
    <p class="tag">빠르고 날카로운 1인칭 슈팅 데스매치 · 먼저 25킬</p>
    <button id="play">PLAY</button>
    <div class="opts">
      <label>감도 <input id="sens" type="range" min="0.3" max="3" step="0.05" value="1" /></label>
      <label>볼륨 <input id="vol" type="range" min="0" max="1" step="0.05" value="0.6" /></label>
      <label>화질
        <select id="quality"><option value="high">높음</option><option value="med" selected>보통</option><option value="low">낮음</option></select>
      </label>
    </div>
    <div class="keys">
      <span><b>WASD</b> 이동</span><span><b>마우스</b> 시점</span><span><b>좌클릭</b> 발사</span><span><b>우클릭</b> 조준</span>
      <span><b>SHIFT</b> 달리기</span><span><b>SPACE</b> 점프</span><span><b>R</b> 재장전</span><span><b>1~4 / 휠</b> 무기 교체</span>
      <span><b>TAB</b> 점수판</span><span><b>ESC</b> 일시정지</span>
    </div>
  </div>
</div>
<div id="end" class="hidden"><div class="menuInner"><div class="logo" id="endTitle">VICTORY</div><p id="endStats" class="tag"></p><button id="again">AGAIN</button></div></div>
<script type="module" src="/src/main.js"></script>
</body>
</html>

name: Build Android APK
on:
  push:
    paths: ['aurora-web/**', 'aurora-agent/src/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aurora-web } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: npm install
      - run: npm run android:init
      - run: chmod +x gradlew && ./gradlew assembleDebug
        working-directory: aurora-web/android
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraAgent-apk
          path: aurora-web/android/app/build/outputs/apk/debug/*.apk

name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: AbandonedSchool/Library
          key: Library-Windows-${{ hashFiles('AbandonedSchool/Assets/**', 'AbandonedSchool/Packages/**', 'AbandonedSchool/ProjectSettings/**') }}
          restore-keys: Library-Windows-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: AbandonedSchool
          unityVersion: 2022.3.50f1
          targetPlatform: StandaloneWindows64
          buildMethod: AbandonedSchool.EditorTools.SchoolSceneBuilder.BuildWindowsCI
          buildsPath: build

      - uses: actions/upload-artifact@v4
        with:
          name: AbandonedSchool-Windows
          path: build/StandaloneWindows64
          if-no-files-found: error

      - name: Zip and attach to release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cd build/StandaloneWindows64 && zip -r ../../AbandonedSchool-Windows.zip .
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: AbandonedSchool-Windows.zip

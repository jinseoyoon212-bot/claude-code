name: Warbattle builds
on:
  workflow_dispatch:
  push:
    paths: ['warbattle/**', '.github/workflows/warbattle.yml']
jobs:
  windows-exe:
    runs-on: windows-latest
    defaults: { run: { working-directory: warbattle/desktop } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm install
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with: { name: Warbattle-windows, path: warbattle/dist/desktop/*.exe }
  android-apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: warbattle/mobile } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: android-actions/setup-android@v3
      - run: npm install
      - run: npm run prepare-web
      - run: '[ -d android ] || npx cap add android'
      - run: npx cap sync android
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with: { name: Warbattle-android, path: warbattle/mobile/android/app/build/outputs/apk/debug/*.apk }

name: Build Windows exe
on:
  push:
    paths: ['aurora-agent/**', '.github/workflows/build-exe.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults: { run: { working-directory: aurora-agent } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: AuroraAgent-windows
          path: aurora-agent/dist/*.exe
